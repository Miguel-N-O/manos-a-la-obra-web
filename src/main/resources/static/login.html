<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Manos a la Obra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 440px;">
    <h1 class="h3 fw-bold text-center mb-4">Iniciar sesión</h1>
    <div id="cuentaCreada" class="alert alert-success d-none">¡Cuenta creada! Ya puedes iniciar sesión.</div>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <form id="formularioLogin" class="card card-body shadow-sm" novalidate>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input type="email" class="form-control" id="correo" name="correo" autocomplete="username" maxlength="150" required>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="clave" name="clave" autocomplete="current-password" maxlength="72" required>
      </div>
      <button type="submit" id="botonEntrar" class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="registro.html">Crear mi cuenta</a></p>
    <p class="text-center mt-2"><a href="index.html">Volver al inicio</a></p>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
